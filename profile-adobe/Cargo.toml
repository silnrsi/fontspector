[package]
name = "fontspector-profile-adobe"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "adobe-fontspectorplugin"
path = "src/main.rs"

[dependencies]
fontspector-checkapi = { path = "../fontspector-checkapi", features = [
    "kurbo",
    "sourcefix",
    "plugin",
] }
skrifa = { workspace = true }
write-fonts = { workspace = true }
itertools = { workspace = true }

[features]
# The "check" feature enables dependencies only needed for checks, not fixes.
default = ["check"]
sourcefix = ["fontspector-checkapi/sourcefix"]
check = []

[lints]
workspace = true
